# use C-a as main prefix
unbind C-b
set -g prefix C-a

# make switching windows using numbers easier
set -g prefix2 M-';'

# use ^a ^a to forward prefix to nested tmux
bind C-a send-prefix
bind M-';' send-prefix -2

# faster key response
set -sg escape-time 0
set -g @copytk-flash-time 0.2

# faster status refresh from 15s
set -g status-interval 5

# increase scrollback buffer size from 2000
set -g history-limit 50000

# increase tmux messages display duration from 750ms
set -g display-time 3000

# better terminal integration
set -s extended-keys on
set -s extended-keys-format xterm
set -as terminal-features 'xterm-ghostty:extkeys'

# easier splits (vim-ish)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# copy-mode system clipboard sync
set -g set-clipboard on
set -g @fastcopy-action 'tmux load-buffer -w -'
set -g @copytk-copy-command 'tmux load-buffer -w -'

# normal mode cursor
set -g cursor-style bar

# copy-mode cursor
set-hook -g pane-mode-changed \
  'if -F "#{pane_in_mode}" "set -g cursor-style block" "set -g cursor-style bar"'

# use vim mode in copy mode
setw -g mode-keys vi
bind v copy-mode
bind C-k copy-mode
# use v to start visual selection (vim muscle memory)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# use emacs key bindings in tmux command prompt (prefix + :)
set -g status-keys emacs

bind a last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Open new panes and splits in the same working directory.
bind c new-window -c "#{pane_current_path}"

# start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# easier and faster switching between next/prev/last window
bind C-p previous-window
bind C-n next-window
bind C-space switch-client -l

bind M-1 select-window -t 1
bind M-2 select-window -t 2
bind M-3 select-window -t 3
bind M-4 select-window -t 4
bind M-5 select-window -t 5
bind M-6 select-window -t 6

# tmux-sessionizer
bind -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind -r C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# mouse support
set -g mouse on

# options to make tmux more pleasant
set -g default-terminal "xterm-256color"
set -g terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'
set -g allow-rename off

# focus events enabled for terminals that support them
set -g focus-events on

# for multi-monitor setups or grouped sessions
setw -g aggressive-resize on

# configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "#0f0b18"
set -g @catppuccin_window_current_text " #{window_name}"
set -g @catppuccin_window_text " #{window_name}"
set -g @catppuccin_window_default_text " #{window_name}"

set -g @catppuccin_window_current_number_color "#{@thm_lavender}"

# configure tpm plugin keys
set -g @fzf-links-key o
set -g @fastcopy-key C-v
set -g @copytk-no-default-binds on

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf
bind R source-file ~/.config/tmux/tmux.conf

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'abhinav/tmux-fastcopy'
set -g @plugin 'CrispyConductor/tmux-copy-toolkit'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alberti42/tmux-fzf-links'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-battery'

run '~/.config/tmux/plugins/tpm/tpm'
