# Keep window open on video end
keep-open=yes

# No colorspace hinting on fullscreen
target-colorspace-hint=no

# Player settings
cursor-autohide=100
autofit=75%x75%

# GPU-Next: https://github.com/mpv-player/mpv/wiki/GPU-Next-vs-GPU
vo=gpu-next
gpu-api=vulkan

# Use hardware decoding if available
hwdec=auto-safe
hwdec-codecs=all

# Audio settings
volume-max=200
audio-pitch-correction=yes

# No debanding or interpolation
deband=no
interpolation=no

# Lanczos scaling
scale=bilinear
cscale=bilinear
dscale=bilinear

# Drop frames to avoid audio desync
framedrop=vo

# Always cache streams
cache=auto
cache-pause=no
demuxer-max-bytes=4GiB
demuxer-max-back-bytes=2GiB

# Subtitle settings
demuxer-mkv-subtitle-preroll=yes
embeddedfonts=yes

# Always prefer english
alang=eng,en,enUS,en-US,jpn,jp
slang=eng,en,enUS,en-US

# Fallback to forced subtitles
subs-fallback=yes
subs-fallback-forced=always

# Subtitle file detection
sub-auto=fuzzy
sub-file-paths=.,ass,srt,sub,subs,subtitles

# Save position and watch history
save-position-on-quit=yes
save-watch-history=yes
# osd-bar=no
# border=no
osd-playlist-entry=both

# Load profiles
load-auto-profiles=yes
load-select=yes
load-context-menu=yes
load-positioning=yes
