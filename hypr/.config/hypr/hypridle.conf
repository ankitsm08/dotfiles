general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 360
    # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-timeout = brightnessctl -s set 10 && ddcutil dumpvcp /tmp/vcpdumpdisplay1 --display 1 && ddcutil setvcp 10 10 --display 1 --sleep-multiplier=2
    # monitor backlight restore.
    on-resume = brightnessctl -r && ddcutil loadvcp --display 1 /tmp/vcpdumpdisplay1 && rm /tmp/vcpdumpdisplay1
}

