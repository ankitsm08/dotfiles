# stank defaults - everything not listed uses these
[defaults]
target=home
folding=true
method=stow

# file-only packages: per-file links, never fold the whole dir
[discord]
folding=false

[gpg]
folding=false

# machine-wide config, stowed to / with sudo
[system]
target=/

[sddm-theme]
target=/
method=copy

[grub-theme]
target=/
method=copy
